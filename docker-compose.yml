services:
  postgres:
    image: postgres:16-alpine
    container_name: products_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-products_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_products:/var/lib/postgresql/data
      - ./products.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_products:
